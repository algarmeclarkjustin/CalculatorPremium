<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121b">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <p class="eyebrow">Your numbers, your way</p>
    <h1>Calculator</h1>
    <section class="calculator" aria-label="Calculator">
      <div class="screen" aria-live="polite" aria-atomic="true">
        <div class="expression" id="expression" aria-label="Expression"></div>
        <div class="result" id="result" aria-label="Display">0</div>
      </div>
      <div class="keypad" aria-label="Calculator keys">
        <button class="key utility" type="button" data-action="clear" aria-label="Clear">AC</button>
        <button class="key utility" type="button" data-action="backspace" aria-label="Delete last digit">DEL</button>
        <button class="key utility" type="button" data-value="%" aria-label="Percent">%</button>
        <button class="key operator" type="button" data-value="/" aria-label="Divide">÷</button>
        <button class="key" type="button" data-value="7">7</button>
        <button class="key" type="button" data-value="8">8</button>
        <button class="key" type="button" data-value="9">9</button>
        <button class="key operator" type="button" data-value="*" aria-label="Multiply">×</button>
        <button class="key" type="button" data-value="4">4</button>
        <button class="key" type="button" data-value="5">5</button>
        <button class="key" type="button" data-value="6">6</button>
        <button class="key operator" type="button" data-value="-" aria-label="Subtract">−</button>
        <button class="key" type="button" data-value="1">1</button>
        <button class="key" type="button" data-value="2">2</button>
        <button class="key" type="button" data-value="3">3</button>
        <button class="key operator" type="button" data-value="+" aria-label="Add">+</button>
        <button class="key zero" type="button" data-value="0">0</button>
        <button class="key" type="button" data-value=".">.</button>
        <button class="key equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
    <p class="hint">Enter an expression and press = to see the results.</p>
  </main>

  <div class="overlay" id="premium-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description" hidden>
    <section class="dialog">
      <div class="crown" aria-hidden="true">♛</div>
      <h2 id="dialog-title">Buy Premium to see your results</h2>
      <p id="dialog-description">Your result is <strong>NA</strong>. Choose a Premium plan to unlock it.</p>
      <div class="plans" aria-label="Premium plans">
        <article class="plan">
          <h3>Monthly</h3>
          <p class="price">₱99 <span>/ month</span></p>
          <button class="upgrade" type="button" data-plan="Monthly">Buy Monthly</button>
        </article>
        <article class="plan featured">
          <span class="recommended">BEST VALUE</span>
          <h3>Yearly Premium</h3>
          <p class="price">₱799 <span>/ year</span></p>
          <button class="upgrade" type="button" data-plan="Yearly">Buy Yearly</button>
        </article>
      </div>
      <p class="checkout-note" id="checkout-note" aria-live="polite"></p>
      <div class="dialog-actions">
        <button class="close" type="button" id="close-button">Maybe later</button>
      </div>
    </section>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
